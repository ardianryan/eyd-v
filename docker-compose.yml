version: "3.8"

services:
  eyd-v:
    build:
      context: .
      dockerfile: Dockerfile
    image: ardianryan/eyd-v:5.2.0
    container_name: eyd-v-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
