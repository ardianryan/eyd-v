name: CI & Benchmark Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Jalankan pengujian otomatis setiap hari Senin pukul 07.00 WIB (00.00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Benchmark Test Suite
      run: npm test

    - name: Verify CLI Commands
      run: |
        node bin/cli.js --version
        node bin/cli.js check "Di mana kamu kuliah pascasarjana?"
        node bin/cli.js search "tanda titik dua"
        node bin/cli.js prompt
